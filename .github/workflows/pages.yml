name: Deploy prototype to GitHub Pages

# Publishes wander-prototype/ as the site root, so the prototype keeps its
# folder name and nothing else in the repo is served.
# Settings → Pages → Source must be set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'wander-prototype/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./wander-prototype
      - id: deployment
        uses: actions/deploy-pages@v4
